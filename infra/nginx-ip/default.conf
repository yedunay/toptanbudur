# ---------------------------------------------------------------------------
# DOMAINSIZ / TLS'SİZ nginx yapılandırması — YALNIZ GELİŞTİRME AŞAMASI İÇİN.
#
# Domain alınmadan sunucuya IP üzerinden erişilirken kullanılır. Domain
# bağlandığında bu dosya BIRAKILIR ve normal `nginx` servisine (TLS + Let's
# Encrypt, infra/nginx/) geçilir.
#
# ⚠️ Bu yapılandırmada TLS YOK: trafik şifresiz akar. Gerçek müşteri verisi
#    girilmemeli, kart ödemesi denenmemelidir.
# ---------------------------------------------------------------------------

upstream tb_frontend { server frontend:3001; keepalive 32; }
upstream tb_admin    { server admin:3002;    keepalive 32; }
upstream tb_backend  { server backend:4000;  keepalive 32; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Makbuz/fatura PDF ve destek eki yüklemeleri için (backend 15mb JSON kabul
    # ediyor; nginx sınırı bunun altında kalmamalı).
    client_max_body_size 200m;

    # PayTR/3DS ödeme sayfası iframe içinde açılır → DENY kullanılamaz.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # nginx dış scope'taki proxy_set_header'ları miras almadığı için her
    # location'da yeniden tanımlanır.
    location ^~ /api/ {
        proxy_pass http://tb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        # Bildirim akışı (SSE) tamponlanmamalı, yoksa canlı bildirim gelmez.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /admin/ {
        proxy_pass http://tb_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { return 301 /admin/; }

    location ^~ /_next/ {
        proxy_pass http://tb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
    }
}
